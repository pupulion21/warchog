[profile.default]
src = "src"
test = "test"
out = "out"
solc_version = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
# Use real CREATEs: dynamic linking rewrites them to deployCode cheatcodes and can
# make a constructor-revert expectation terminate a test before later assertions.
dynamic_test_linking = false
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]
allow_paths = ["../node_modules"]

[fuzz]
runs = 256

[profile.audit.fuzz]
runs = 10000

[profile.audit.invariant]
runs = 1024
depth = 128
fail_on_revert = true
